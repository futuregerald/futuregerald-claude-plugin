name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'

      - name: Run tests
        run: go test -v ./...

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python test deps
        run: pip install pytest pyyaml

      - name: Run skill script tests
        run: PYTHONDONTWRITEBYTECODE=1 pytest -p no:cacheprovider -q skills/*/scripts antigravity/hooks

      - name: Build
        run: go build -o skill-installer .

      - name: Verify binary runs
        run: ./skill-installer version
